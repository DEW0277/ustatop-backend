# Production (Contabo VPS). Ishga tushirish va yangilash: docs/DEPLOY.md
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Barcha sirlar .env.production'da (namuna: .env.production.example) — bu faylda hech qanday sir yo'q.
name: ustatop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  image: ustatop-backend:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
  env_file: .env.production
  environment:
    NODE_ENV: production
    PORT: "3000"
    # Bitta ishonchli proxy — nginx (rate limit haqiqiy mijoz IP'si bo'yicha).
    TRUST_PROXY: "1"
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: garage
    S3_PORT: "3900"
    S3_USE_SSL: "false"
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET: ${S3_BUCKET:-ustatop-uploads}
    STORAGE_PUBLIC_URL: https://${DOMAIN}/uploads
    CORS_ORIGINS: https://${DOMAIN}
  networks: [internal]
  logging: *logging

services:
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      S3_BUCKET: ${S3_BUCKET:-ustatop-uploads}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  # Sertifikatni yangilab turadi (har 12 soatda tekshiradi). Birinchi sertifikat qo'lda olinadi — docs/DEPLOY.md.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    logging: *logging

  # Bir martalik: har `up`da kutilayotgan migratsiyalarni qo'llaydi, backend undan keyin ko'tariladi.
  migrate:
    <<: *backend
    restart: "no"
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully

  web:
    image: ustatop-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  # Fayl ombori — Garage (S3-mos; MinIO'ning ommaviy image'lari endi yo'q, TASKS.md E-09). Konfiguratsiya:
  # deploy/garage/garage.toml; sirlar .env.production'da. Public o'qish nginx /uploads/ → garage:3902.
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks: [internal]
    logging: *logging

  # Bir martalik (har `up`da, idempotent): layout, S3 kalit, bucket, public o'qish — deploy/garage/init.sh.
  garage-init:
    image: alpine:3.22
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-ustatop-uploads}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-50000000000}
    volumes:
      - ./deploy/garage/init.sh:/init.sh:ro
    depends_on:
      - garage
    networks: [internal]
    logging: *logging

# postgres/redis/garage tashqariga port ochmaydi — faqat ichki tarmoqda. Tashqariga faqat nginx (80/443).
networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
  letsencrypt:
  certbot_webroot:
