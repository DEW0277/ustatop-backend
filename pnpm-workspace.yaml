packages:
  - "apps/*"
  - "packages/*"
overrides:
  # @nestjs/platform-express o'zining ichki multer nusxasini oladi (2.2.0) — bu DoS zaifliklariga
  # ega versiya (GHSA-qvfw-j98x-7q72 va boshqalar). Bizning to'g'ridan-to'g'ri pin (2.3.0, package.json)
  # faqat bizning importlarimizga tegadi, shuning uchun butun daraxt bo'ylab majburlanadi.
  multer: "^2.5.0"
  # `prisma`ning ichki `@prisma/config`i va `firebase-admin`ning Google Cloud zanjiri orqali keladi
  # (`pnpm audit`, GHSA-ggr8-5vv4-36mx / GHSA-w5hq-g745-h8pq) — ikkalasi ham runtime so'rov yo'lida
  # ishlatilmaydi (CLI konfiguratsiya va ishlatilmayotgan Firebase xususiyati), lekin bepul tuzatiladi.
  deepmerge-ts: "^8.0.0"
  uuid: "^11.1.1"
  # 2026-10-19 `pnpm audit --prod` (TASKS.md E-11): transitive versions with published fixes that
  # `pnpm update` does not lift inside the parents' ranges. Remove an entry once its parent ships the fix.
  # express (Nest platform-express) — IP spoofing behind `trust proxy`, GHSA critical
  proxy-addr: "^2.0.8"
  # next — librsvg CVE in sharp; postcss source maps DoS
  sharp: "^0.35.5"
  source-map-js: "^1.2.2"
  # @hookform/resolvers > ajv — host normalization
  fast-uri: "^3.1.9"
  # firebase-admin > google-gax — certificate auth context, ReDoS-style brace expansion (2.x line only)
  "@grpc/grpc-js": "^1.14.5"
  "brace-expansion@<2": "^1.1.21"
  "brace-expansion@>=2 <3": "^2.1.7"
  "brace-expansion@>=5 <6": "^5.0.12"
  # dev tooling only (shadcn CLI)
  "@modelcontextprotocol/sdk": "^1.31.0"
  # 2026-10-22 (E-12, PR #49): dev tooling only — shadcn > @modelcontextprotocol/sdk > hono (GHSA-5r4p-p66f-jhc7).
  # (vite 8.3.0–8.3.2 was fixed by a direct `vite` devDependency in backend and web: it is a vitest peer,
  # and overrides do not change auto-installed peers.)
  "hono@>=4.12.4 <4.13.11": "^4.13.11"
  # 2026-11-06 `pnpm audit` (TASKS.md E-14): transitive versions with published fixes.
  # express (Nest platform-express) — body-parser DoS, qs DoS
  "body-parser@>=2 <2.4.0": "^2.4.0"
  "qs@>=6.7 <6.16.1": "^6.16.1"
  # shadcn > @dotenvx/dotenvx (dev tooling only) — undici DoS / cache poisoning / TLS validation
  "undici@>=7 <7.30.1": "^7.30.1"
  systeminformation: "^5.33.16"
  # shadcn > @modelcontextprotocol/sdk (dev tooling only)
  ip-address: "^10.7.4"
  "@hono/node-server@>=1.19.10 <2.1.3": "^2.1.3"
  # eslint-config-next > eslint-plugin-react-hooks > zod (dev tooling only; apps/web pins zod directly)
  "zod@<4.6.6": "^4.6.6"
  # firebase-admin > ... > gaxios > rimraf 5 > glob 10 > minimatch 9 (glob/minimatch advisories only
  # fixed in glob >=14.0.2 / minimatch >=11). gaxios lists rimraf in package.json but never loads it
  # (grep of the gaxios build finds no import), so the rimraf 5 -> 6 jump has no runtime effect.
  "rimraf@<6": "^6.1.4"
  # dev tooling only (@nestjs/cli, typescript-eslint): minimatch DoS, fixed in 11.x only
  "minimatch@>=10 <11": "^11.0.1"
  # 2026-11-11 `pnpm audit` (B-10, PR #55): firebase-admin > @google-cloud/storage — quadratic CPU on
  # unterminated stop-node tags (GHSA-474x-hrwr-fgx4, low). Remove once @google-cloud/storage lifts it.
  "fast-xml-parser@>=5 <5.11.3": "^5.11.3"
allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: false
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    # braces (stack-exhaustion DoS): no fixed release exists yet (latest 3.0.3, advisory says >=3.0.4).
    # Dev tooling only — eslint-config-next and the shadcn CLI glob local files; nothing in the
    # production images. Remove when braces ships a fix (re-check: `pnpm audit`).
    - GHSA-vfj7-8cjw-p6xm
    # deepmerge mergeObject() prototype poisoning (low): no fixed release exists (latest 4.3.1, advisory
    # says >=4.3.2). Dev tooling only (shadcn CLI), nothing in the production images.
    # Remove when deepmerge ships a fix (re-check: `pnpm audit`).
    - GHSA-gcqx-w48m-w2h4
minimumReleaseAgeExclude:
  - vite@8.3.5
