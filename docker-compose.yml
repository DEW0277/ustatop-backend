services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ustatop
      POSTGRES_PASSWORD: ustatop_dev_pass
      POSTGRES_DB: ustatop_db
    ports:
      - "5455:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ustatop -d ustatop_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ustatop
      MINIO_ROOT_PASSWORD: ustatop_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    # `docker compose up --wait` (CI e2e) MinIO so'rov qabul qilishga tayyor bo'lguncha kutsin.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
